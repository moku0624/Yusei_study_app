<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>古文単語トレーニング</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Hiragino Sans', 'Yu Gothic', sans-serif;
            background: linear-gradient(135deg, #f8f6f1 0%, #efe9e0 100%);
            min-height: 100vh;
            padding: 12px;
            color: #2d2520;
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
        }

        /* Header */
        header {
            background: linear-gradient(135deg, #8b4513 0%, #a0522d 100%);
            color: white;
            padding: 24px 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            box-shadow: 0 4px 12px rgba(139, 69, 19, 0.15);
        }

        h1 {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 8px;
            letter-spacing: 0.5px;
        }

        .header-subtitle {
            font-size: 13px;
            opacity: 0.9;
            font-weight: 400;
        }

        /* Progress Section */
        .progress-section {
            background: white;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 16px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
        }

        .progress-label {
            font-size: 12px;
            color: #666;
            margin-bottom: 8px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .progress-bar {
            background: #e8e8e8;
            height: 8px;
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 12px;
        }

        .progress-fill {
            background: linear-gradient(90deg, #8b4513 0%, #a0522d 100%);
            height: 100%;
            border-radius: 4px;
            transition: width 0.3s ease;
        }

        .progress-stats {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
        }

        .stat {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .stat-icon {
            font-size: 16px;
        }

        /* Main Content */
        .quiz-container {
            background: white;
            border-radius: 12px;
            padding: 24px 20px;
            margin-bottom: 16px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
            display: none;
        }

        .quiz-container.active {
            display: block;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .question-number {
            font-size: 12px;
            color: #8b4513;
            font-weight: 600;
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .word-card {
            background: linear-gradient(135deg, #f5ede4 0%, #ebe5dc 100%);
            border-left: 4px solid #8b4513;
            padding: 16px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .word-ja {
            font-size: 28px;
            font-weight: 600;
            color: #2d2520;
            margin-bottom: 4px;
            letter-spacing: 2px;
        }

        .word-reading {
            font-size: 13px;
            color: #666;
            margin-bottom: 12px;
        }

        .word-category {
            display: inline-block;
            background: #8b4513;
            color: white;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 600;
        }

        .question {
            font-size: 14px;
            color: #333;
            margin-bottom: 20px;
            line-height: 1.6;
            padding: 12px;
            background: #fafaf8;
            border-radius: 6px;
        }

        /* Options */
        .options {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .option {
            background: white;
            border: 2px solid #e0e0e0;
            padding: 14px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .option:hover:not(.disabled) {
            border-color: #8b4513;
            background: #fef9f5;
        }

        .option.selected {
            border-color: #8b4513;
            background: #fef9f5;
        }

        .option.correct {
            border-color: #4caf50;
            background: #e8f5e9;
        }

        .option.incorrect {
            border-color: #f44336;
            background: #ffebee;
        }

        .option.disabled {
            cursor: not-allowed;
            opacity: 0.7;
        }

        .option-label {
            min-width: 24px;
            background: #8b4513;
            color: white;
            width: 24px;
            height: 24px;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 12px;
        }

        .option.correct .option-label,
        .option.correct.disabled .option-label {
            background: #4caf50;
        }

        .option.incorrect .option-label {
            background: #f44336;
        }

        /* Feedback */
        .feedback {
            display: none;
            margin-top: 16px;
            padding: 12px;
            border-radius: 8px;
            font-size: 13px;
            line-height: 1.6;
        }

        .feedback.show {
            display: block;
            animation: slideIn 0.3s ease;
        }

        .feedback.correct {
            background: #e8f5e9;
            color: #2e7d32;
            border-left: 4px solid #4caf50;
        }

        .feedback.incorrect {
            background: #ffebee;
            color: #c62828;
            border-left: 4px solid #f44336;
        }

        .feedback-title {
            font-weight: 600;
            margin-bottom: 6px;
        }

        /* Explanation Card */
        .explanation {
            background: #f5ede4;
            padding: 12px;
            border-radius: 6px;
            font-size: 13px;
            line-height: 1.6;
            margin-top: 12px;
        }

        .explanation-row {
            display: flex;
            gap: 8px;
            margin-bottom: 8px;
        }

        .explanation-row:last-child {
            margin-bottom: 0;
        }

        .explanation-label {
            font-weight: 600;
            min-width: 60px;
            color: #8b4513;
        }

        .explanation-text {
            flex: 1;
            color: #333;
        }

        /* Buttons */
        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        button {
            flex: 1;
            padding: 12px 16px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-primary {
            background: linear-gradient(135deg, #8b4513 0%, #a0522d 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(139, 69, 19, 0.3);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        .btn-secondary {
            background: #e8e8e8;
            color: #333;
        }

        .btn-secondary:hover {
            background: #ddd;
        }

        /* Start Screen */
        .start-screen {
            background: white;
            border-radius: 12px;
            padding: 40px 20px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
        }

        .start-screen.hidden {
            display: none;
        }

        .start-icon {
            font-size: 48px;
            margin-bottom: 20px;
        }

        .start-screen h2 {
            font-size: 20px;
            margin-bottom: 12px;
            color: #2d2520;
        }

        .start-screen p {
            font-size: 13px;
            color: #666;
            margin-bottom: 24px;
            line-height: 1.6;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 24px;
        }

        .stat-card {
            background: linear-gradient(135deg, #f5ede4 0%, #ebe5dc 100%);
            padding: 16px;
            border-radius: 8px;
        }

        .stat-number {
            font-size: 24px;
            font-weight: 700;
            color: #8b4513;
        }

        .stat-label {
            font-size: 12px;
            color: #666;
            margin-top: 4px;
        }

        /* Result Screen */
        .result-screen {
            background: white;
            border-radius: 12px;
            padding: 40px 20px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
            display: none;
        }

        .result-screen.show {
            display: block;
            animation: slideIn 0.3s ease;
        }

        .result-icon {
            font-size: 48px;
            margin-bottom: 16px;
        }

        .result-screen h2 {
            font-size: 20px;
            margin-bottom: 12px;
            color: #2d2520;
        }

        .result-details {
            background: #f5ede4;
            padding: 16px;
            border-radius: 8px;
            margin: 24px 0;
            font-size: 14px;
        }

        .result-score {
            font-size: 32px;
            font-weight: 700;
            color: #8b4513;
        }

        .result-score-label {
            font-size: 13px;
            color: #666;
            margin-top: 4px;
        }

        .difficulty-selector {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            border-bottom: 2px solid #e0e0e0;
            padding-bottom: 12px;
        }

        .difficulty-btn {
            flex: 1;
            padding: 8px 12px;
            background: white;
            border: none;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            border-radius: 6px 6px 0 0;
            color: #666;
            transition: all 0.2s ease;
            position: relative;
        }

        .difficulty-btn.active {
            color: #8b4513;
        }

        .difficulty-btn.active::after {
            content: '';
            position: absolute;
            bottom: -14px;
            left: 0;
            right: 0;
            height: 2px;
            background: #8b4513;
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 40px 20px;
        }

        .empty-icon {
            font-size: 48px;
            margin-bottom: 16px;
        }

        .empty-state h3 {
            font-size: 16px;
            margin-bottom: 8px;
            color: #2d2520;
        }

        .empty-state p {
            font-size: 13px;
            color: #666;
        }

        /* Responsive */
        @media (max-width: 480px) {
            body {
                padding: 8px;
            }

            header {
                padding: 20px 16px;
            }

            h1 {
                font-size: 20px;
            }

            .word-ja {
                font-size: 24px;
            }

            .stats-grid {
                grid-template-columns: 1fr;
            }
        }

        /* Streak Counter */
        .streak {
            display: inline-block;
            background: #ff6b6b;
            color: white;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            margin-left: 8px;
        }

        /* Daily Goal */
        .daily-goal {
            background: #fef9f5;
            border-left: 4px solid #ff9800;
            padding: 12px;
            border-radius: 6px;
            font-size: 13px;
            margin-top: 16px;
        }

        .goal-title {
            font-weight: 600;
            color: #ff6b00;
            margin-bottom: 4px;
        }

        .goal-text {
            color: #666;
        }

        /* レベル選択 */
        .level-selector {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .level-btn {
            flex: 1;
            min-width: 100px;
            padding: 10px 12px;
            background: white;
            border: 2px solid #e0e0e0;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            border-radius: 6px;
            color: #666;
            transition: all 0.2s ease;
        }

        .level-btn:hover {
            border-color: #8b4513;
            color: #8b4513;
        }

        .level-btn.active {
            background: linear-gradient(135deg, #8b4513 0%, #a0522d 100%);
            color: white;
            border-color: #8b4513;
        }

        .level-badge {
            display: inline-block;
            background: #ff6b6b;
            color: white;
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
            margin-top: 8px;
        }

        /* リトライキュー表示 */
        .retry-queue {
            background: #fff3e0;
            border-left: 4px solid #ff9800;
            padding: 12px;
            border-radius: 6px;
            font-size: 13px;
            margin-bottom: 16px;
        }

        .retry-queue-title {
            font-weight: 600;
            color: #ff6b00;
            margin-bottom: 6px;
        }

        .retry-queue-text {
            color: #333;
        }

        .retry-stats {
            display: flex;
            gap: 12px;
            margin-top: 8px;
            font-size: 12px;
        }

        .retry-stat {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        /* 穴埋め問題のスタイル */
        .fill-in-question {
            background: #fafaf8;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 20px;
            line-height: 1.8;
        }

        .blank {
            background: #fff3e0;
            padding: 4px 8px;
            border-radius: 4px;
            font-weight: 600;
            display: inline-block;
            min-width: 60px;
            text-align: center;
        }

        /* 文脈問題のスタイル */
        .context-question {
            background: #f5ede4;
            padding: 16px;
            border-radius: 8px;
            margin-bottom: 20px;
            border-left: 4px solid #8b4513;
        }

        .context-title {
            font-size: 12px;
            color: #666;
            margin-bottom: 8px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .context-text {
            font-size: 14px;
            line-height: 1.8;
            color: #333;
            margin-bottom: 12px;
        }

        .context-highlight {
            background: #fff3e0;
            padding: 2px 4px;
            font-weight: 600;
            border-radius: 2px;
        }

        .context-question-text {
            font-size: 13px;
            color: #666;
            margin-top: 12px;
            font-style: italic;
        }

        /* 誤答トラッキング */
        .error-tracking {
            background: #ffebee;
            border-left: 4px solid #f44336;
            padding: 12px;
            border-radius: 6px;
            font-size: 12px;
            margin-top: 12px;
        }

        .error-count {
            font-weight: 600;
            color: #c62828;
        }

        @media (max-width: 480px) {
            .level-btn {
                flex: 1;
                min-width: 80px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header>
            <h1>古文単語トレーニング</h1>
            <p class="header-subtitle" id="phaseSubtitle">Phase 1 - 必出60語</p>
        </header>

        <!-- Progress Section -->
        <div class="progress-section">
            <div class="progress-label">今日の学習</div>
            <div>
                <div class="progress-bar">
                    <div class="progress-fill" id="dailyProgressFill"></div>
                </div>
                <div class="progress-stats">
                    <div class="stat">
                        <span class="stat-icon">✅</span>
                        <span id="dailyCorrect">0</span>問正解
                    </div>
                    <div class="stat">
                        <span class="stat-icon">📚</span>
                        <span id="totalMastered">0</span>/<span id="totalWords">60</span>語習得
                    </div>
                </div>
            </div>
            <div class="daily-goal">
                <div class="goal-title">🎯 本日の目標</div>
                <div class="goal-text">あと<span id="todayGoal">5</span>問でセッション完了！</div>
            </div>
        </div>

        <!-- Start Screen -->
        <div class="start-screen" id="startScreen">
            <div class="start-icon">📖</div>
            <h2>古文単語を習いましょう</h2>
            <p>古文の単語を段階的に学習します。<br>スキマ時間を活用して効率よく習得できます。</p>
            
            <div class="retry-queue" id="retryQueueDisplay" style="display: none;">
                <div class="retry-queue-title">🔄 復習対象の単語がある</div>
                <div class="retry-queue-text">
                    <div class="retry-stats">
                        <div class="retry-stat">
                            <span>未定着:</span>
                            <span class="error-count" id="retryCount">0</span>語
                        </div>
                        <div class="retry-stat">
                            <span>誤答率:</span>
                            <span id="errorRate">0</span>%
                        </div>
                    </div>
                </div>
            </div>

            <div style="margin-bottom: 20px;">
                <div class="progress-label" style="margin-bottom: 12px;">学習フェーズを選択</div>
                <div class="level-selector">
                    <button class="level-btn active" onclick="selectPhase(1)">
                        <div>Phase 1</div>
                        <div style="font-size: 11px; font-weight: 400; margin-top: 4px;">必出60語</div>
                    </button>
                    <button class="level-btn" onclick="selectPhase(2)">
                        <div>Phase 2</div>
                        <div style="font-size: 11px; font-weight: 400; margin-top: 4px;">重要50語</div>
                    </button>
                    <button class="level-btn" onclick="selectPhase(3)">
                        <div>Phase 3</div>
                        <div style="font-size: 11px; font-weight: 400; margin-top: 4px;">応用30語</div>
                    </button>
                </div>
            </div>

            <div style="margin-bottom: 20px;">
                <div class="progress-label" style="margin-bottom: 12px;">難度レベルを選択</div>
                <div class="level-selector">
                    <button class="level-btn active" onclick="selectLevel(1)">
                        <div>Lv.1</div>
                        <div style="font-size: 11px; font-weight: 400; margin-top: 4px;">4択問題</div>
                    </button>
                    <button class="level-btn" onclick="selectLevel(2)">
                        <div>Lv.2</div>
                        <div style="font-size: 11px; font-weight: 400; margin-top: 4px;">穴埋め</div>
                    </button>
                    <button class="level-btn" onclick="selectLevel(3)">
                        <div>Lv.3</div>
                        <div style="font-size: 11px; font-weight: 400; margin-top: 4px;">文脈問題</div>
                    </button>
                </div>
            </div>

            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-number" id="totalWordsStart">60</div>
                    <div class="stat-label">全単語数</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number" id="masteredStart">0</div>
                    <div class="stat-label">習得済み</div>
                </div>
            </div>
            <button class="btn-primary" onclick="startSession()">学習を開始</button>
        </div>

        <!-- Quiz Container -->
        <div class="quiz-container active" id="quizContainer">
            <div class="question-number" id="questionNum"></div>
            
            <div class="word-card">
                <div class="word-ja" id="wordDisplay"></div>
                <div class="word-reading" id="wordReading"></div>
                <span class="word-category" id="wordCategory"></span>
            </div>

            <div class="question" id="questionText"></div>

            <div class="options" id="optionsContainer"></div>

            <div class="feedback" id="feedback">
                <div class="feedback-title" id="feedbackTitle"></div>
                <div id="feedbackText"></div>
                <div class="explanation" id="explanation"></div>
            </div>

            <div class="button-group" id="buttonGroup" style="display: none;">
                <button class="btn-primary" onclick="nextQuestion()">次へ</button>
            </div>
        </div>

        <!-- Result Screen -->
        <div class="result-screen" id="resultScreen">
            <div class="result-icon" id="resultIcon">🎉</div>
            <h2 id="resultTitle">セッション完了！</h2>
            <div class="result-details">
                <div class="result-score" id="resultScore">5</div>
                <div class="result-score-label">問中 正解</div>
                <div style="margin-top: 12px; font-size: 13px; color: #666;" id="resultMessage"></div>
            </div>
            <button class="btn-primary" onclick="returnToStart()">続ける</button>
            <button class="btn-secondary" onclick="viewStats()">詳細を見る</button>
        </div>
    </div>

    <script>
        // 古文単語データベース
        const vocabulary = [
            // グループA: 現代語と意味がズレている形容詞
            {
                id: 1,
                word: "をかし",
                reading: "をかし",
                category: "形容詞",
                meanings: ["素晴らしい", "趣深い", "美しい"],
                modernMeaning: "可笑しい（滑稽）",
                pitfall: "❌ 意味が大きく異なる。入試の誤訳選択肢になりやすい",
                examples: [
                    "月の光いとをかし = 月の光が素晴らしく美しい"
                ]
            },
            {
                id: 2,
                word: "あはれ",
                reading: "あはれ",
                category: "形容詞",
                meanings: ["しみじみとした趣", "情緒的", "哀れな"],
                modernMeaning: "あわれ（哀れ・可哀そう）",
                pitfall: "△ 微妙にズレる。古文では「情趣」の意味が強い",
                examples: [
                    "秋風いとあはれなり = 秋風が情趣深い"
                ]
            },
            {
                id: 3,
                word: "さうざうし",
                reading: "さうざうし",
                category: "形容詞",
                meanings: ["そっけない", "つまらない", "不足である"],
                modernMeaning: "存在しない",
                pitfall: "❌ 現代語に相当する表現がない。覚えるしかない",
                examples: [
                    "その程の心つきさうざうし = その程度の気配りが足りない"
                ]
            },
            {
                id: 4,
                word: "わろし",
                reading: "わろし",
                category: "形容詞",
                meanings: ["悪い", "劣っている", "醜い"],
                modernMeaning: "悪い",
                pitfall: "✅ 比較的現代語と通じやすい",
                examples: [
                    "容貌いとわろし = 容姿が見劣りする"
                ]
            },
            {

        // 学習管理変数
        let currentSession = [];
        let currentQuestionIndex = 0;
        let correctCount = 0;
        let sessionStarted = false;
        let userAnswers = {};
        let masterList = {}; // 習得状況を記録 {wordId: correctCount}
        let errorLog = {}; // 誤答ログ {wordId: [timestamp, timestamp, ...]}
        let selectedLevel = 1; // 現在選択されているレベル（1-3）
        let selectedPhase = 1; // 現在選択されているPhase（1-3）

        // LocalStorageから学習データを復元
        function loadProgress() {
            const savedMaster = localStorage.getItem('kobunProgress');
            if (savedMaster) {
                masterList = JSON.parse(savedMaster);
            }
            
            const savedErrors = localStorage.getItem('kobunErrors');
            if (savedErrors) {
                errorLog = JSON.parse(savedErrors);
            }
        }

        // LocalStorageに学習データを保存
        function saveProgress() {
            localStorage.setItem('kobunProgress', JSON.stringify(masterList));
            localStorage.setItem('kobunErrors', JSON.stringify(errorLog));
        }

        // 学習フェーズを選択
        function selectPhase(phase) {
            selectedPhase = phase;
            
            // タイトルを更新
            const phaseInfo = {
                1: "Phase 1 - 必出60語",
                2: "Phase 2 - 重要50語",
                3: "Phase 3 - 応用30語"
            };
            document.getElementById('phaseSubtitle').textContent = phaseInfo[phase];
            
            // UI更新：選択状態を表示（フェーズボタン）
            const phaseButtons = document.querySelectorAll('.level-selector')[0]?.querySelectorAll('.level-btn') || [];
            phaseButtons.forEach((btn, index) => {
                if (index + 1 === phase) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
            });

            // 総単語数を更新
            const phaseWords = getPhaseWords(phase);
            const masteredInPhase = phaseWords.filter(w => masterList[w.id]).length;
            document.getElementById('totalWordsStart').textContent = phaseWords.length;
            document.getElementById('masteredStart').textContent = masteredInPhase;
            
            // 復習対象の表示を更新
            updateRetryQueueDisplay();
            
            // 進捗表示を更新
            updateProgressDisplay();
        }

        // 学習難度レベルを選択
        function selectLevel(level) {
            selectedLevel = level;
            
            // UI更新：選択状態を表示（難度ボタン）
            const levelSelectors = document.querySelectorAll('.level-selector');
            const levelButtons = levelSelectors[1]?.querySelectorAll('.level-btn') || [];
            levelButtons.forEach((btn, index) => {
                if (index + 1 === level) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
            });
        }

        // 選択されたPhaseの単語を取得するヘルパー関数
        function getPhaseWords(phase) {
            if (phase === 1) {
                return vocabulary.filter(w => !w.phase);
            } else {
                return vocabulary.filter(w => w.phase === phase);
            }
        }

        // 自動リトライキューを取得（誤答した単語を優先）
        function buildRetryQueue() {
            const retryList = [];
            
            // 選択されたPhaseの単語のみを対象
            const phaseWords = getPhaseWords(selectedPhase);
            
            // 誤答3回以上の単語を最優先
            phaseWords.forEach(word => {
                const errorCount = errorLog[word.id]?.length || 0;
                const masterCount = masterList[word.id] || 0;
                
                // 未習得（masterCount < 3）または誤答が多い単語を追加
                if (masterCount < 3 || errorCount >= 3) {
                    retryList.push({
                        word: word,
                        priority: errorCount * 10 + (3 - Math.min(masterCount, 3))
                    });
                }
            });
            
            // 優先度でソート（高いほど先）
            retryList.sort((a, b) => b.priority - a.priority);
            
            return retryList.map(item => item.word);
        }

        // リトライキューの状態を表示
        function updateRetryQueueDisplay() {
            const retryQueue = buildRetryQueue();
            const display = document.getElementById('retryQueueDisplay');
            
            if (retryQueue.length > 0) {
                display.style.display = 'block';
                document.getElementById('retryCount').textContent = retryQueue.length;
                
                // 現在のPhaseの全体の誤答率を計算
                const phaseWords = getPhaseWords(selectedPhase);
                let totalErrors = 0;
                let totalAttempts = 0;
                phaseWords.forEach(word => {
                    const errorCount = errorLog[word.id]?.length || 0;
                    const masterCount = masterList[word.id] || 0;
                    totalErrors += errorCount;
                    totalAttempts += errorCount + masterCount;
                });
                
                const errorRate = totalAttempts > 0 ? Math.round((totalErrors / totalAttempts) * 100) : 0;
                document.getElementById('errorRate').textContent = errorRate;
            } else {
                display.style.display = 'none';
            }
        }

        // ページ読み込み時の初期化
        function initializePage() {
            loadProgress();
            selectPhase(1); // Phase 1をデフォルト選択してタイトルを更新
            updateProgressDisplay();
            updateRetryQueueDisplay();
            displayStartScreen();
        }

        // 学習セッションの開始
        function startSession() {
            sessionStarted = true;
            correctCount = 0;
            currentQuestionIndex = 0;
            userAnswers = {};

            // 選択されたPhaseの単語を抽出
            const phaseWords = getPhaseWords(selectedPhase);

            // リトライキューがあれば優先、なければランダムに選択
            const retryQueue = buildRetryQueue();
            let sessionWords = [];
            
            if (retryQueue.length > 0) {
                // リトライキューから選択
                sessionWords = retryQueue.slice(0, 5);
            } else {
                // ランダムに選択
                sessionWords = [...phaseWords].sort(() => Math.random() - 0.5).slice(0, 5);
            }
            
            currentSession = sessionWords;

            document.getElementById('startScreen').classList.add('hidden');
            document.getElementById('resultScreen').classList.remove('show');
            document.getElementById('quizContainer').classList.add('active');

            displayQuestion();
        }

        // 問題を表示
        function displayQuestion() {
            const question = currentSession[currentQuestionIndex];
            const errorCount = errorLog[question.id]?.length || 0;
            
            document.getElementById('questionNum').textContent = `Phase ${selectedPhase} | 問題 ${currentQuestionIndex + 1} / 5 (Lv.${selectedLevel})`;
            document.getElementById('wordDisplay').textContent = question.word;
            document.getElementById('wordReading').textContent = `（${question.reading}）`;
            document.getElementById('wordCategory').textContent = question.category;

            // レベルに応じた問題を表示
            if (selectedLevel === 1) {
                displayLevel1(question);
            } else if (selectedLevel === 2) {
                displayLevel2(question);
            } else if (selectedLevel === 3) {
                displayLevel3(question);
            }

            // 誤答があれば警告を表示
            if (errorCount > 0) {
                const errorTracking = document.querySelector('.error-tracking');
                if (errorTracking) {
                    errorTracking.style.display = 'block';
                    errorTracking.innerHTML = `<div class="error-count">⚠️ この単語は${errorCount}回誤答しています</div>`;
                } else {
                    const feedback = document.getElementById('feedback');
                    feedback.insertAdjacentHTML('beforebegin', 
                        `<div class="error-tracking"><div class="error-count">⚠️ この単語は${errorCount}回誤答しています</div></div>`);
                }
            }

            // フィードバックをリセット
            document.getElementById('feedback').classList.remove('show', 'correct', 'incorrect');
            document.getElementById('buttonGroup').style.display = 'none';
        }

        // レベル1：4択問題
        function displayLevel1(question) {
            document.getElementById('questionText').textContent = `「${question.word}」の古文での主な意味は？`;
            generateOptions(question);
        }

        function displayLevel2(question) {
            const container = document.getElementById('questionText');

                        = 「～${question.meanings[0]}～」

            // 選択肢：4つの異なる意味から選ぶ

        // レベル3：文脈問題
        function displayLevel3(question) {
            const container = document.getElementById('questionText');
            const example = question.examples[0] || "例文がありません";
            const [exampleText, meaning] = example.split(' = ');
            
            container.innerHTML = `

                    </div>
                    <div class="context-question-text">
                        この文における「${question.word}」の意味として最も適切なものは？

                </div>
            `;
            
            // 選択肢：意味 + 用法を含める
            generateContextOptions(question);

        // 複数意味から選ぶ（レベル2用）
        function generateMultipleMeaningOptions(question) {
            const container = document.getElementById('optionsContainer');
            container.innerHTML = '';

            // 他の単語から異なる意味を3つ取得
            const wrongAnswers = generateWrongAnswers(question);
            const allOptions = [question.meanings[0], ...wrongAnswers];
            
            // 最初の4つをシャッフル
            const shuffledOptions = allOptions.slice(0, 4).sort(() => Math.random() - 0.5);

            shuffledOptions.forEach((option, index) => {
                const btn = document.createElement('div');
                btn.className = 'option';
                btn.innerHTML = `
                    <span class="option-label">${String.fromCharCode(65 + index)}</span>
                    <span>${option}</span>
                `;
                btn.onclick = () => selectOption(question, option, btn);
                container.appendChild(btn);
            });
        }

        // 文脈オプション（レベル3用）
        function generateContextOptions(question) {
            const container = document.getElementById('optionsContainer');
            container.innerHTML = '';

            const contextOptions = [
                { meaning: question.meanings[0] },
                { meaning: question.meanings[1] || question.modernMeaning },
                { meaning: generateWrongAnswers(question)[0] },
                { meaning: generateWrongAnswers(question)[1] }
            ];

            const shuffled = contextOptions.sort(() => Math.random() - 0.5);

            shuffled.forEach((option, index) => {
                const btn = document.createElement('div');
                btn.className = 'option';
                btn.innerHTML = `
                    <span class="option-label">${String.fromCharCode(65 + index)}</span>
                    <span>${option.meaning}</span>
                `;
                btn.onclick = () => selectOption(question, option.meaning, btn);
                container.appendChild(btn);
            });
        }

        // 選択肢を生成
        function generateOptions(question) {
            const container = document.getElementById('optionsContainer');
            container.innerHTML = '';

            // 正答と4つの選択肢を用意
            const allOptions = [question.meanings[0], ...generateWrongAnswers(question)];
            const shuffledOptions = allOptions.sort(() => Math.random() - 0.5).slice(0, 4);

            shuffledOptions.forEach((option, index) => {
                const btn = document.createElement('div');
                btn.className = 'option';
                btn.innerHTML = `
                    <span class="option-label">${String.fromCharCode(65 + index)}</span>
                    <span>${option}</span>
                `;
                btn.onclick = () => selectOption(question, option, btn);
                container.appendChild(btn);
            });
        }

        // 不正答を生成
        function generateWrongAnswers(question) {
            // 他の単語の意味から不正答を取得
            const wrongAnswers = new Set();
            const usedWords = new Set([question.id]);

            // 他の単語から3つの異なる意味を取得
            while (wrongAnswers.size < 3) {
                let randomWord = null;
                let attempts = 0;
                
                // 最大10回まで試して、異なる単語を探す
                while (attempts < 10) {
                    const candidate = vocabulary[Math.floor(Math.random() * vocabulary.length)];
                    if (!usedWords.has(candidate.id) && candidate.meanings[0] !== question.meanings[0]) {
                        randomWord = candidate;
                        usedWords.add(candidate.id);
                        break;
                    }
                    attempts++;
                }
                
                if (randomWord) {
                    // 正答と絶対に重複しない意味を追加
                    if (!wrongAnswers.has(randomWord.meanings[0]) && 
                        randomWord.meanings[0] !== question.meanings[0]) {
                        wrongAnswers.add(randomWord.meanings[0]);
                    }
                }
            }

            return Array.from(wrongAnswers);
        }

        // 選択肢をクリックした時
        function selectOption(question, selectedMeaning, element) {
            const isCorrect = selectedMeaning === question.meanings[0];
            userAnswers[currentQuestionIndex] = { selected: selectedMeaning, correct: isCorrect };

            if (isCorrect) {
                correctCount++;
                element.classList.add('correct');
                masterList[question.id] = (masterList[question.id] || 0) + 1;
            } else {
                element.classList.add('incorrect');
                
                // 誤答をログに記録
                if (!errorLog[question.id]) {
                    errorLog[question.id] = [];
                }
                errorLog[question.id].push(new Date().getTime());
            }

            // 全ての選択肢を無効化
            document.querySelectorAll('.option').forEach(opt => {
                opt.classList.add('disabled');
            });

            // 正答を表示
            document.querySelectorAll('.option').forEach(opt => {
                if (opt.textContent.includes(question.meanings[0])) {
                    opt.classList.add('correct');
                }
            });

            // フィードバックを表示
            showFeedback(question, isCorrect);

            // 次へボタンを表示
            document.getElementById('buttonGroup').style.display = 'flex';
        }

        // フィードバックを表示
        function showFeedback(question, isCorrect) {
            const feedback = document.getElementById('feedback');
            const title = document.getElementById('feedbackTitle');
            const text = document.getElementById('feedbackText');
            const explanation = document.getElementById('explanation');

            if (isCorrect) {
                feedback.classList.add('correct');
                title.textContent = '✅ 正解！';
                text.textContent = `「${question.word}」は「${question.meanings[0]}」が正しい意味です。`;
            } else {
                feedback.classList.add('incorrect');
                title.textContent = '❌ 不正解';
                text.textContent = `「${question.word}」の正しい意味は「${question.meanings[0]}」です。`;
            }

            // 解説を表示
            let explanationHtml = `
                <div class="explanation-row">
                    <span class="explanation-label">古文:</span>
                    <span class="explanation-text">${question.meanings[0]}</span>
                </div>
                <div class="explanation-row">
                    <span class="explanation-label">現代語:</span>
                    <span class="explanation-text">${question.modernMeaning}</span>
                </div>
                <div class="explanation-row">
                    <span class="explanation-label">ポイント:</span>
                    <span class="explanation-text">${question.pitfall}</span>
                </div>
            `;

            if (question.examples.length > 0) {
                explanationHtml += `
                    <div class="explanation-row">
                        <span class="explanation-label">例文:</span>
                        <span class="explanation-text">${question.examples[0]}</span>
                    </div>
                `;
            }

            explanation.innerHTML = explanationHtml;
            feedback.classList.add('show');
        }

        // 次の問題へ
        function nextQuestion() {
            currentQuestionIndex++;
            if (currentQuestionIndex < currentSession.length) {
                displayQuestion();
            } else {
                showResults();
            }
        }

        // 結果を表示
        function showResults() {
            saveProgress();
            updateProgressDisplay();

            document.getElementById('quizContainer').classList.remove('active');
            document.getElementById('resultScreen').classList.add('show');

            const resultScore = document.getElementById('resultScore');
            const resultTitle = document.getElementById('resultTitle');
            const resultMessage = document.getElementById('resultMessage');
            const resultIcon = document.getElementById('resultIcon');

            resultScore.textContent = `${correctCount}/5`;

            if (correctCount === 5) {
                resultIcon.textContent = '🎉';
                resultTitle.textContent = 'パーフェクト！';
                resultMessage.textContent = '5問すべて正解！素晴らしい調子で学習を続けましょう。';
            } else if (correctCount >= 4) {
                resultIcon.textContent = '👍';
                resultTitle.textContent = 'よくできました！';
                resultMessage.textContent = `${correctCount}問正解。もう一度セッションをしてみましょう。`;
            } else if (correctCount >= 3) {
                resultIcon.textContent = '💪';
                resultTitle.textContent = 'なかなか頑張ってますね';
                resultMessage.textContent = `${correctCount}問正解。反復学習で着実に定着させましょう。`;
            } else {
                resultIcon.textContent = '🔥';
                resultTitle.textContent = 'まだ始まったばかり';
                resultMessage.textContent = `${correctCount}問正解。毎日コツコツ学習して定着させましょう。`;
            }

            // 今日のセッション数をカウント
            const today = new Date().toDateString();
            const todayKey = `session_${today}`;
            const sessionCount = (parseInt(localStorage.getItem(todayKey)) || 0) + 1;
            localStorage.setItem(todayKey, sessionCount.toString());
        }

        // 結果画面から元に戻る
        function returnToStart() {
            document.getElementById('resultScreen').classList.remove('show');
            document.getElementById('startScreen').classList.remove('hidden');
            sessionStarted = false;
            updateProgressDisplay();
            updateRetryQueueDisplay();
        }

        // 進捗表示を更新
        function updateProgressDisplay() {
            // 選択されたPhaseの単語を対象に計算
            const phaseWords = getPhaseWords(selectedPhase);
            const masteredCount = phaseWords.filter(w => masterList[w.id]).length;
            const totalWords = phaseWords.length;
            const percentage = Math.round((masteredCount / totalWords) * 100);

            document.getElementById('totalMastered').textContent = masteredCount;
            document.getElementById('totalWords').textContent = totalWords;
            document.getElementById('totalWordsStart').textContent = totalWords;
            document.getElementById('masteredStart').textContent = masteredCount;

            // 進捗バーを更新
            document.getElementById('dailyProgressFill').style.width = percentage + '%';

            // 今日正解した問題数を表示
            const today = new Date().toDateString();
            const todayKey = `session_${today}`;
            const todayCorrect = parseInt(localStorage.getItem(`correct_${today}`) || '0');
            document.getElementById('dailyCorrect').textContent = correctCount;

            // 今日のセッション残数を計算
            const sessionCount = parseInt(localStorage.getItem(todayKey)) || 0;
            const todayGoal = Math.max(0, 20 - (sessionCount * 5));
            document.getElementById('todayGoal').textContent = todayGoal;
        }

        // スタート画面を表示
        function displayStartScreen() {
            document.getElementById('quizContainer').classList.remove('active');
            document.getElementById('resultScreen').classList.remove('show');
            document.getElementById('startScreen').classList.remove('hidden');
        }

        // 詳細統計を表示（ダミー）
        function viewStats() {
            alert(`本日の学習:\n正解: ${correctCount}問\n習得語数: ${Object.keys(masterList).length}/${vocabulary.length}語\n\n定期的な学習を続けることで、古文単語が着実に定着します！`);
        }

        // ページロード時に初期化
        window.addEventListener('load', initializePage);
    </script>
</body>
</html>
